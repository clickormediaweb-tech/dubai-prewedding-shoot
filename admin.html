<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Dubai Pre-Wedding</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lato', sans-serif; background: #F9F8F6; padding: 40px 20px; color: #1A1A1A; }
        .admin-container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="file"] { width: 100%; padding: 10px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; }
        .btn-save { background: #1A1A1A; color: white; border: none; padding: 12px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; transition: 0.3s; }
        .btn-save:hover { background: #333; }
        .success-msg { color: green; font-weight: bold; text-align: center; margin-top: 15px; display: none; }
        
        /* Bookings Table Style */
        .bookings-section { margin-top: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 0.9rem; }
        th { background: #1A1A1A; color: white; }
    </style>
</head>
<body>

<div class="admin-container">
    <h2>Admin Control Panel</h2>
    <p>Manage website images and check customer shoot bookings here.</p>

    <div class="form-group">
        <label>1. Change Hero Background Image</label>
        <input type="file" id="heroFile" accept="image/*">
    </div>

    <div class="form-group">
        <label>2. Change Location Cards Image</label>
        <input type="file" id="locFile" accept="image/*">
    </div>

    <div class="form-group">
        <label>3. Change Booking Section Image</label>
        <input type="file" id="bookFile" accept="image/*">
    </div>

    <button class="btn-save" onclick="saveImages()">Save & Update Website</button>
    <div id="successMsg" class="success-msg">✅ Successfully Updated!</div>

    <!-- Client Booking List Section -->
    <div class="bookings-section">
        <h3>Customer Shoot Bookings</h3>
        <p>List of clients who booked a shoot through the calendar form:</p>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Location</th>
                    <th>Package</th>
                </tr>
            </thead>
            <tbody id="bookingTableBody">
                <!-- Bookings will show here dynamically -->
            </tbody>
        </table>
    </div>
</div>

<script>
    
    // Admin panel khulte hi password prompt aayega
    const password = prompt("🔐 Enter Admin Password:");
    
    // Yahan aap apna pasandida password rakh sakti hain
    if (password !== "dubai2026") {
        alert("❌ Incorrect Password! Redirecting to home page.");
        window.location.href = "index.html"; // Galat password daalne par main website par bhej dega
    }

    function convertToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function saveImages() {
        const heroInput = document.getElementById('heroFile').files[0];
        const locInput = document.getElementById('locFile').files[0];
        const bookInput = document.getElementById('bookFile').files[0];

        if (heroInput) localStorage.setItem('heroImage', await convertToBase64(heroInput));
        if (locInput) localStorage.setItem('loc1Image', await convertToBase64(locInput));
        if (bookInput) localStorage.setItem('bookingImage', await convertToBase64(bookInput));

        const msg = document.getElementById('successMsg');
        msg.style.display = 'block';
        setTimeout(() => { msg.style.display = 'none'; }, 4000);
    }

    // Load Bookings into Admin Table
    function loadBookings() {
        const bookings = JSON.parse(localStorage.getItem('shootBookings')) || [];
        const tbody = document.getElementById('bookingTableBody');
        tbody.innerHTML = '';

        if(bookings.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#888;">No bookings yet.</td></tr>';
            return;
        }

        bookings.forEach(b => {
            const row = `<tr>
                <td>${b.date}</td>
                <td>${b.location}</td>
                <td>${b.package}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    window.onload = loadBookings;
</script>

</body>
</html>
